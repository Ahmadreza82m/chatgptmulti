name: PhotoFrame Studio Android APK
on:
  push:
    branches: [photoframe-studio]
    paths:
      - 'photoframe-studio/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photoframe-studio
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APK
        run: |
          gradle --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFrame-Studio-APKs
          path: |
            photoframe-studio/app/build/outputs/apk/debug/*.apk
            photoframe-studio/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
